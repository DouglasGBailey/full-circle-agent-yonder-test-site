# Serves only Laravel's public/ folder. Everything else in the image is out of reach.
<VirtualHost *:80>
    # The scheme makes Apache's own redirects (trailing slash) point at https, since TLS ends at nginx.
    ServerName https://yonder-test-site.terminalvelocityai.tech
    UseCanonicalName On
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # No dotfiles (.env, .git, .htaccess) and no source maps, even if one slipped into public/.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.map$">
        Require all denied
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
