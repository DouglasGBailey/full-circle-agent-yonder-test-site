# chrisweb: /home/webadmin/web-stack/conf/conf.d/yonder-test-site-preview.terminalvelocityai.tech.conf (the demo site for yonder-test-site)
# Apply: docker exec nginx-webstack nginx -t && docker restart nginx-webstack
# Needs: sudo ufw allow in on docker0 to any port 8881 proto tcp

server {
    listen 80;
    server_name yonder-test-site-preview.terminalvelocityai.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yonder-test-site-preview.terminalvelocityai.tech;

    ssl_certificate     /etc/letsencrypt/live/terminalvelocityai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terminalvelocityai.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 2m;

    access_log /var/log/nginx/yonder-test-site-preview.access.log;
    error_log  /var/log/nginx/yonder-test-site-preview.error.log;

    # Never pass dotfiles or source maps to the app.
    location ~ /\.(?!well-known) { return 404; }
    location ~ \.map$ { return 404; }

    location / {
        proxy_pass http://172.17.0.1:8881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
    }
}
